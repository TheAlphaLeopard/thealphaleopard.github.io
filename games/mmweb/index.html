<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sonic Megamix Mania</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #canvas {
        display: block;
        background: #000;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
      }

      /* ---------- Loading screen (all black, white UI, logo hero) ---------- */
      #loader-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      #loader-logo {
        width: min(78vw, 520px);
        height: auto;
        margin-bottom: 44px;
        user-select: none;
        -webkit-user-drag: none;
      }
      #loader-bar-wrap { width: min(70vw, 460px); }
      #loader-progress {
        position: relative;
        width: 100%;
        height: 10px;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        overflow: hidden;
      }
      #loader-progress-fill {
        position: relative;
        width: 0%;
        min-width: 0;
        height: 100%;
        background: #fff;
        border-radius: 999px;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.55);
        transition: width 0.15s linear;
      }
      #loader-status {
        box-sizing: border-box;
        width: min(70vw, 460px);
        min-height: 46px;
        margin-top: 18px;
        padding: 12px 18px;
 
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-align: center;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #loader-status.err {
        border-color: rgba(255, 120, 120, 0.7);
        background: rgba(255, 60, 60, 0.12);
      }
      body.engine-ready #loader-overlay { display: none; }

      /* ---------- Fullscreen toggle (top-right, visible after engine boots) ---------- */
      #fs-btn {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 20;
        width: 36px;
        height: 36px;
        padding: 0;
        background: rgba(0,0,0,0.55);
        color: #ddd;
        border: 1px solid #444;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        display: none;
      }
      #fs-btn:hover { background: rgba(0,0,0,0.85); border-color: #888; }
      body.engine-ready #fs-btn { display: block; }

      /* ---------- Touch controls (mobile only, activated by JS) ---------- */
      #touch-controls {
        position: fixed;
        inset: 0;
        z-index: 15;
        pointer-events: none;
        display: none;
      }
      body.touch-mode #touch-controls { display: block; }
      body.touch-mode.engine-ready #touch-controls { display: block; }

      .tc-btn {
        position: absolute;
        background: rgba(255,255,255,0.18);
        border: 2px solid rgba(255,255,255,0.35);
        color: #fff;
        font-weight: bold;
        font-family: "Nunito", system-ui, sans-serif;
        text-align: center;
        line-height: 1;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        touch-action: none;
      }
      .tc-btn:active, .tc-btn.pressed {
        background: rgba(255,255,255,0.5);
        border-color: rgba(255,255,255,0.9);
      }

      .dpad {
        position: absolute;
        bottom: calc(24px + env(safe-area-inset-bottom));
        left: calc(24px + env(safe-area-inset-left));
        width: 168px;
        height: 168px;
      }
      .dpad .tc-btn { width: 56px; height: 56px; border-radius: 8px; }
      .dpad .up    { top: 0;    left: 56px; }
      .dpad .down  { bottom: 0; left: 56px; }
      .dpad .left  { top: 56px; left: 0;    }
      .dpad .right { top: 56px; right: 0;   }

      .face-buttons {
        position: absolute;
        bottom: calc(24px + env(safe-area-inset-bottom));
        right: calc(24px + env(safe-area-inset-right));
        width: 180px;
        height: 140px;
      }
      .face-buttons .tc-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .face-buttons .btn-y { top: 0;    left: 60px; }
      .face-buttons .btn-a { bottom: 0; left: 0;   }
      .face-buttons .btn-b { bottom: 0; right: 0;  }
    </style>
  </head>

    <script>
      /* =================== EDIT THIS LINE ===================
  Paste YOUR jsDelivr URL below, keep the trailing slash.
  Format: https://cdn.jsdelivr.net/gh/USER/REPO@BRANCH/
  Example: https://cdn.jsdelivr.net/gh/sonicfan/mmx-web@main/
  ====================================================== */
      var CDN_BASE = "https://fastly.jsdelivr.net/gh/TheAlphaLeopard/megamix-mania-port@master/";
      var REQUIRE_BASE = true;
      /* Bridge for dataloader.js: it prefixes every file it fetches with this. */
      window.__MMX_BASE__ = CDN_BASE;

      var fsBtn = document.getElementById("fs-btn");
      var canvas = document.getElementById("canvas");
      var statusEl = document.getElementById("loader-status");

      function setStatus(text, isErr) {
        if (!statusEl) return;
        statusEl.textContent = text;
        statusEl.classList.toggle("err", !!isErr);
      }

      function fitCanvasToViewport() {
        if (!canvas) return;
        var explicit = canvas.hasAttribute("width") && canvas.hasAttribute("height");
        var iw = canvas.width;
        var ih = canvas.height;
        var aspect = (explicit && iw > 0 && ih > 0) ? (iw / ih) : (16 / 9);
        var ww = window.innerWidth;
        var wh = window.innerHeight;
        var w, h;
        if (ww / wh > aspect) {
          h = wh;
          w = Math.round(wh * aspect);
        } else {
          w = ww;
          h = Math.round(ww / aspect);
        }
        canvas.style.setProperty("width", w + "px", "important");
        canvas.style.setProperty("height", h + "px", "important");
      }
      fitCanvasToViewport();
      window.addEventListener("resize", fitCanvasToViewport);
      window.addEventListener("orientationchange", fitCanvasToViewport);
      document.addEventListener("fullscreenchange", fitCanvasToViewport);
      document.addEventListener("webkitfullscreenchange", fitCanvasToViewport);
      if (window.MutationObserver && canvas) {
        new MutationObserver(fitCanvasToViewport).observe(canvas, {
          attributes: true,
          attributeFilter: ["width", "height"]
        });
      }

      function isTouchDevice() {
        if (window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches) return true;
        return ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
      }
      if (isTouchDevice()) document.body.classList.add("touch-mode");

      fsBtn.addEventListener("click", function () {
        var target = canvas;
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(function () {});
        } else if (target.requestFullscreen) {
          target.requestFullscreen().catch(function () {});
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        }
      });

      /* --- Touch controls: synthesize keyboard events the engine listens for --- */
      var pressedKeys = Object.create(null);
      function synthKey(type, key) {
        var ev = new KeyboardEvent(type, {
          key: key,
          code: keyToCode(key),
          bubbles: true,
          cancelable: true,
        });
        (canvas || document).dispatchEvent(ev);
        window.dispatchEvent(ev);
      }
      function keyToCode(key) {
        if (key === "ArrowUp" || key === "ArrowDown" || key === "ArrowLeft" || key === "ArrowRight") return key;
        if (key === "Enter" || key === "Escape" || key === "Tab" || key === "Space") return key;
        if (/^[a-zA-Z]$/.test(key)) return "Key" + key.toUpperCase();
        if (/^[0-9]$/.test(key)) return "Digit" + key;
        return key;
      }
      function pressKey(btn) {
        var keys = (btn.getAttribute("data-key") || "").split(",");
        var keyId = keys.join("|");
        if (pressedKeys[keyId]) return;
        pressedKeys[keyId] = true;
        btn.classList.add("pressed");
        for (var i = 0; i < keys.length; ++i) synthKey("keydown", keys[i]);
      }
      function releaseKey(btn) {
        var keys = (btn.getAttribute("data-key") || "").split(",");
        var keyId = keys.join("|");
        if (!pressedKeys[keyId]) return;
        delete pressedKeys[keyId];
        btn.classList.remove("pressed");
        for (var i = 0; i < keys.length; ++i) synthKey("keyup", keys[i]);
      }
      document.querySelectorAll("#touch-controls .tc-btn").forEach(function (btn) {
        var down = function (e) { e.preventDefault(); pressKey(btn); };
        var up   = function (e) { e.preventDefault(); releaseKey(btn); };
        btn.addEventListener("touchstart", down, { passive: false });
        btn.addEventListener("touchend", up, { passive: false });
        btn.addEventListener("touchcancel", up, { passive: false });
        btn.addEventListener("mousedown", down);
        btn.addEventListener("mouseup", up);
        btn.addEventListener("mouseleave", up);
      });

      /* --- Audio unlock on first user gesture --- */
      function unlockAudio() {
        try {
          if (window.__audioCtx && window.__audioCtx.state === "suspended") {
            window.__audioCtx.resume();
          }
        } catch (e) {}
        document.removeEventListener("click", unlockAudio);
        document.removeEventListener("keydown", unlockAudio);
        document.removeEventListener("touchstart", unlockAudio);
      }
      document.addEventListener("click", unlockAudio, { once: true });
      document.addEventListener("keydown", unlockAudio, { once: true });
      document.addEventListener("touchstart", unlockAudio, { once: true });

      /* --- Boot: dataloader.js (chunk fetching + assembly) then the engine --- */
      function onStart() {
        if (REQUIRE_BASE && (!CDN_BASE || CDN_BASE.indexOf("PASTE-") === 0)) {
          setStatus(
            "Setup needed:\n" +
            "Open this file in a text editor and paste your jsDelivr URL\n" +
            "into the CDN_BASE line near the top, then reload.\n\n" +
            "Format:  https://cdn.jsdelivr.net/gh/USER/REPO@main/",
            true
          );
          return;
        }
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            var ctx = new AC();
            if (ctx.state === "suspended") ctx.resume();
            window.__audioCtx = ctx;
          }
        } catch (e) {}

        setStatus("Loading game loader\u2026");
        var dl = document.createElement("script");
        dl.src = CDN_BASE + "dataloader.js";
        dl.onerror = function () {
          setStatus("Could not load dataloader.js from:\n" + dl.src, true);
        };
        dl.onload = function () {
          var ready = window.__dataloaderReady;
          if (!ready || typeof ready.then !== "function") {
            setStatus("dataloader.js failed to initialize.", true);
            return;
          }
          ready.then(function () {
            var eng = document.createElement("script");
            eng.src = CDN_BASE + "RSDKv5U.js";
            eng.async = true;
            eng.onerror = function () {
              setStatus("Could not load RSDKv5U.js from:\n" + eng.src, true);
            };
            document.body.appendChild(eng);
          }).catch(function (e) {
            setStatus("Load failed: " + (e && e.message ? e.message : e), true);
          });
        };
        document.body.appendChild(dl);
      }

      if (document.readyState === "complete") onStart();
      else window.addEventListener("load", onStart);
    </script>
  </body>
</html>
